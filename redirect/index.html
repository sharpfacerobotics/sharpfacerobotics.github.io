<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emerald High School Robotics has moved</title>

    <!-- Tells search engines the new address is the real one, so ranking and
         any inbound links transfer instead of being split across two sites.
         GitHub Pages cannot issue a real 301, so this plus the refresh below
         is the closest equivalent a static host can do. -->
    <link rel="canonical" href="https://emeraldrobotics.github.io/" />
    <meta name="robots" content="noindex, follow" />

    <!-- 0-second refresh is the fallback for browsers that block the script -->
    <meta http-equiv="refresh" content="0; url=https://emeraldrobotics.github.io/" />

    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #07080b; color: #f2f4f7; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 2rem;
      }
      .m { max-width: 32rem; }
      h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 0.75rem; }
      p  { color: #98a2b3; line-height: 1.6; margin: 0 0 1.5rem; }
      a  {
        display: inline-block; color: #04211f; background: #4fe0d8;
        text-decoration: none; font-weight: 600;
        padding: 0.8rem 1.4rem; border-radius: 999px;
      }
      a:hover { background: #6bece5; }
    </style>
  </head>
  <body>
    <div class="m">
      <h1>We&rsquo;ve moved</h1>
      <p>
        Emerald High School Robotics now lives at
        <strong>emeraldrobotics.github.io</strong>.
        You should be sent there automatically.
      </p>
      <a href="https://emeraldrobotics.github.io/">Go to the new site</a>
    </div>

    <script>
      /* replace() rather than assign() so the old address does not end up in
         the back-button history -- otherwise "back" bounces the visitor
         straight into the redirect again and they cannot leave. */
      location.replace('https://emeraldrobotics.github.io/' + location.hash);
    </script>
  </body>
</html>
